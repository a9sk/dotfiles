# Kitty config — i3-like status bar look
# Blacker background, white text, green/red accents

font_family            JetBrainsMono Nerd Font
font_size              20.0
bold_font              auto
italic_font            auto
adjust_line_height     105%

# Window colors / background
background             #000000
foreground             #ffffff

# Window style (i3-like = flat, minimal)
background_opacity     1.0
background_blur        0

cursor                 #ffffff
cursor_shape           beam
cursor_blink_interval  0.6

window_padding_width   12
window_border_width    1
inactive_border_color  #0f0f0f
active_border_color    #69CE69
hide_window_decorations yes

# 16-color palette (no inline comments; keep hex only)
color0  #000000
color1  #BF616A
color2  #69CE69
color3  #EBCB8B
color4  #f0f0f0
color5  #c0c0c0
color6  #d0d0d0
color7  #ffffff

color8   #0b0b0b
color9   #D06F79
color10  #7BE882
color11  #F1D8A3
color12  #ffffff
color13  #dcdcdc
color14  #e5e5e5
color15  #ffffff

selection_foreground   #ffffff
selection_background   #69CE69

# Misc
scrollback_lines       10000
enable_audio_bell      no

# Optional niceties that make it feel more i3-ish
draw_bold_text_with_bright_colors yes
